name: Build Cross-Platform Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Forces GitHub to use the new Node 24 engine and silences all warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # 1. BUILD WINDOWS (.exe)
  # ==========================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Zip Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows-release.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: windows-release.zip

  # ==========================================
  # 2. BUILD ANDROID (.apk) & LINUX
  # ==========================================
  build-android-linux:
    name: Build Android & Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux Build Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Linux App
        run: flutter build linux --release

      - name: Create Linux Install Script
        # This dynamically writes the install.sh file directly into the bundle folder!
        run: |
          cat << 'EOF' > build/linux/x64/release/bundle/install.sh
          #!/bin/bash
          echo " Installing Resume Builder..."
          
          APP_NAME="resume_builder"
          DISPLAY_NAME="Resume Builder"
          INSTALL_DIR="$HOME/.local/share/ResumeBuilder"
          DESKTOP_DIR="$HOME/.local/share/applications"
          EXEC_PATH="$INSTALL_DIR/$APP_NAME"
          ICON_PATH="$INSTALL_DIR/data/flutter_assets/assets/icon.png"

          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"
          mkdir -p "$DESKTOP_DIR"

          cp -r ./* "$INSTALL_DIR/"
          chmod +x "$EXEC_PATH"

          cat <<INNER_EOF > "$DESKTOP_DIR/resume_builder.desktop"
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=$DISPLAY_NAME
          Comment=A cross-platform, offline resume builder
          Exec=$EXEC_PATH
          Icon=$ICON_PATH
          Terminal=false
          Categories=Office;Utility;
          INNER_EOF

          chmod +x "$DESKTOP_DIR/resume_builder.desktop"
          update-desktop-database "$DESKTOP_DIR" &> /dev/null || true

          echo " Installation complete! You can now launch '$DISPLAY_NAME' from your application menu."
          EOF
          chmod +x build/linux/x64/release/bundle/install.sh

      - name: Zip Linux Build
        # Now the zip will automatically include your install.sh file!
        run: zip -r linux-release.zip build/linux/x64/release/bundle/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-App
          path: linux-release.zip

  # ==========================================
  # 3. BUILD MACOS (.app)
  # ==========================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Zip macOS Build
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/*.app macos-release.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App
          path: macos-release.zip

  # ==========================================
  # 4. BUILD & DEPLOY WEB (GitHub Pages)
  # ==========================================
  build-web:
    name: Build & Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web App
        run: flutter build web --release --base-href "/resume_builder/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web